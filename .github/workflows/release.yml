name: Release

# Pushing a v<version> tag publishes the neutron-ai crate. The crates-io
# environment holds CARGO_REGISTRY_TOKEN and asks for approval first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check the tag matches the crate version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$version" = "${GITHUB_REF_NAME#v}" || { echo "Cargo.toml is $version, the tag is ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: cargo test --locked
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
